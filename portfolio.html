
<!DOCTYPE html>
<html>
<head>
    <title>Student Portfolio</title>
</head>
<body>

    <main style = "background: #f5f3ff; padding:16px; font-family:Arial; color:#0f172a;" >
        <div style ="background:linear-gradient(135deg,#4f46e5,#7c3aed); colour:white; padding:18px; border-radius:16px; text-align:center;">
            <h1 style = "margin:0;">Student Portfolio</h1>
        </div>

        <section style="background:white;padding:16px; margin-top:12px; border-radius:16px; text-align: center; box-shadow: 0 3px 12px #6b6969;">
            <h1>About Me</h1>
            <img src="profile.jpg" alt="Rahul" width="100" height="100" style="border-radius:50%; border:3px solid #4663e5;">
            <p style = "margin:8px 0 0;"> <b>Rahul | CSE Student</b></p>
        </section>

        <section style="background:white;padding:16px; margin-top:12px; border-radius:16px;  box-shadow: 0 3px 6px #6b6969;">
            <h2>My Skills</h2>
            <ul style = "display:flex; gap:8px; list-style: none; padding:0;">
                <li style="background:#ede9fe; color:#4338ca; padding:8px 14px; border-radius:20px;"><b>HTML</b></li>
                <li style="background:#ede9fe; color:#4338ca; padding:8px 14px; border-radius:20px;"><b>Python</b></li>
            </ul>
        </section>

        <section style="background:white;padding:16px; margin-top:12px; border-radius:16px;  box-shadow: 0 3px 6px #6b6969;">
            <h2 style="margin:0 0 12px; color:#0f172a; font-size:20px;">My Projects</h2>
            <p>Registration Form | Library Page</p>
        </section>

        <section style="background:white;padding:16px; margin-top:12px; border-radius:16px;  box-shadow: 0 3px 6px #6b6969;" >
            <h2>Course Registration</h2>

            <form>
                <label for="name">Full Name</label><br>
                <input type="text" id="name" name="name" required style = "box-sizing: border-box; width:100%; padding:10px; margin:6px 0 12px; background:#f8fafc; border:1px solid #cbd5e1; border-radius:9px;"><br>

                <label for="email">Email</label><br>
                <input type="email" id="email" name="email" required style = "box-sizing: border-box; width:100%; padding:10px; margin:6px 0 12px; background:#f8fafc; border:1px solid #cbd5e1; border-radius:9px;"><br>

                <label for="course">Course</label><br>
                <select id="course" name="course" style = "box-sizing: border-box; width:100%; padding:10px; margin:6px 0 12px; background:#f8fafc; border:1px solid #cbd5e1; border-radius:9px;">
                    <option>HTML</option>
                    <option>Python</option>
                </select>

                <p>Learning Mode:</p>

                <label>
                    <input type="radio" name="mode" value="online">
                    Online
                </label>

                <label>
                    <input type="radio" name="mode" value="offline">
                    Offline
                </label>

                <br>

                <label for="comments">Comments</label><br>
                <textarea id="comments" name="comments" rows="2" style = "box-sizing: border-box; width:100%; padding:10px; margin:6px 0 12px; background:#f8fafc; border:1px solid #cbd5e1; border-radius:9px;"></textarea>

                <p>
                    <label>
                        <input type="checkbox" name="agree">
                        I agree
                    </label>
                </p>

                <button style = "background:#4f46e5; color: white; padding:10px 18px; border = 0 ; border-radius:50px;">Register</button>
                <button type="reset" style = "background:#4f46e5; color: white; padding:10px 18px; border = 0; border-radius:50px;">Reset</button>
            </form>
        </section>

        <section style = "background:white; padding:16px; margin-top:12px; border-radius: 16px;">
            <h2>Contact</h2>
            <a href="mailto:ananya@example.com" style = "display:inline-block; background: #ede9fe; color: #4338ca; boarding:8px 16px; border-radius:20px; text-decoration:none;">Email Me</a>
        </section>

    </main>

</body>
</html>
